# Training Configuration

efficientnet_b3:
  img_size: 300
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  dropout: 0.3
  scheduler:
    type: StepLR
    step_size: 10
    gamma: 0.5
  augmentation:
    horizontal_flip: true
    rotation_degrees: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

yolov8:
  model: yolov8n.pt         # nano; use yolov8s/m/l for better accuracy
  img_size: 640
  epochs: 100
  batch_size: 16
  conf_threshold: 0.25
  iou_threshold: 0.50
  device: ""                # auto-select GPU if available
