name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (CPU-only for CI)
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm efficientnet-pytorch ultralytics
          pip install numpy opencv-python Pillow scikit-learn albumentations
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_integration.py

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ --max-line-length=100 --ignore=E501,W503
